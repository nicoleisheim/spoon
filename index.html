<html lang="de">

<style>
/* Layout: eine Spalte (max. 560px), Kopfkarte mit rosa Verlauf, schwebende Tab-Leiste – weiche Formen, große Tippflächen, wenig Reize */
:root{
  --bg:#fdf3f7; --card:#ffffff; --ink:#2b1621; --muted:#86606f; --line:#f2dbe5;
  --accent:#e2477f; --accent-soft:#fde4ee;
  --hero-a:#f0508a; --hero-b:#ff8f7e;
  --ok:#2f9a6c; --warn:#e0912f; --warn-soft:#fff0dc; --over:#c62a35; --over-soft:#fde1e2;
  --shadow:0 1px 2px rgba(120,30,70,.05), 0 10px 30px rgba(226,71,127,.08);
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#170e13; --card:#23161d; --ink:#fbeaf1; --muted:#c59aac; --line:#3a2530;
    --accent:#ff7eab; --accent-soft:#45202f;
    --hero-a:#c02a66; --hero-b:#c9574c;
    --ok:#6fd0a0; --warn:#f2b562; --warn-soft:#3b2b1a; --over:#ff6f73; --over-soft:#4a1d22;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170e13; --card:#23161d; --ink:#fbeaf1; --muted:#c59aac; --line:#3a2530;
  --accent:#ff7eab; --accent-soft:#45202f;
  --hero-a:#c02a66; --hero-b:#c9574c;
  --ok:#6fd0a0; --warn:#f2b562; --warn-soft:#3b2b1a; --over:#ff6f73; --over-soft:#4a1d22;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 120px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 2px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.03em}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.warn i{background:var(--warn)}
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{font-family:var(--f-display);font-weight:700;text-align:center;flex:1;letter-spacing:-.01em}
.daynav .lbl small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--shadow);font-size:22px;line-height:1;display:grid;place-items:center;color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.hero{gap:14px;color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:0 14px 34px rgba(226,71,127,.28);
  --accent:#ffffff; --warn:#ffe2a8; --line:rgba(255,255,255,.55); --over:#ffffff; --over-soft:rgba(255,255,255,.12); --muted:rgba(255,255,255,.88)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent);font-size:18px;font-weight:700;line-height:1}
.hero .stepper button{background:rgba(255,255,255,.22);color:#fff}
.status{border-radius:16px;padding:11px 14px;font-size:15px}
.status.ok{background:var(--accent-soft)} .status.warn{background:var(--warn-soft)} .status.over{background:var(--over-soft)}
.hero .status{background:rgba(255,255,255,.2)}
.hero .status.over{background:rgba(70,0,20,.28)}
.spoons{display:flex;flex-wrap:wrap;gap:4px}
.spoon{width:26px;height:30px;stroke:none}
.spoon{fill:var(--accent)}
.spoon.res{fill:var(--warn)}
.spoon.usedup{fill:var(--line);opacity:.55}
.spoon.borrow{fill:rgba(90,0,30,.5)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;background:var(--accent-soft);border-radius:999px;padding:9px 8px 9px 15px;display:inline-flex;gap:8px;align-items:center;min-height:44px;text-align:left;transition:transform .12s ease}
.chip:hover{filter:brightness(.97)}
.chip:active{transform:scale(.96)}
.chip .c{font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:999px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .c.neg{background:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:140px}
input[type=text],input[type=number],textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;min-height:46px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=number]{width:78px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:84px;resize:vertical}
.btn{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:11px 20px;min-height:46px;font-weight:700;box-shadow:0 6px 16px rgba(226,71,127,.25)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.wide{width:100%}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px}
.item .c{font-family:var(--f-display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:20px}
.x:hover{background:var(--over-soft);color:var(--over)}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ok);font-weight:800}
.check:hover{border-color:var(--ok);background:var(--ok);color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:none;background:var(--bg);border-radius:999px;padding:9px 16px;min-height:42px}
.pill[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-weight:700;font-size:15px}
.suggest{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:18px;padding:14px}
.suggest b{font-family:var(--f-display);font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:999px;background:var(--bg);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--accent-soft);border-radius:18px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9px}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.hist:first-child{border-top:none}
.hist .d{width:92px;font-size:14px}
.hist .bar{flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--over-soft);color:var(--over);font-weight:700;white-space:nowrap}
.actrow{display:flex;gap:8px;align-items:center}
.actrow input[type=text]{flex:1;min-width:0}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(120,30,70,.16);border:1px solid var(--line)}
nav.tabs a{color:var(--muted);text-decoration:none;text-align:center;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:999px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:#fff;background:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast button{background:var(--accent);border:none;color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;min-height:34px}
.modal{position:fixed;inset:0;background:rgba(40,10,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.hint{font-size:14px;color:var(--muted);background:var(--accent-soft);border-radius:14px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}

.top{display:flex;align-items:center;gap:8px}
.top .daynav{flex:1;min-width:0}
.top h1{flex:1}
.gear{color:var(--muted)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.planline{font-size:14px;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;color:var(--muted);font-size:15px}
.empty b{font-family:var(--f-display);color:var(--ink);font-size:16px}
.item.planned .n{color:var(--muted)}
details.fold{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:4px 18px}
details.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;cursor:pointer;font-family:var(--f-display);font-weight:700}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{transition:transform .2s;color:var(--muted);font-size:20px}
details.fold[open] summary .chev{transform:rotate(90deg)}
details.fold .inner{display:flex;flex-direction:column;gap:10px;padding:0 0 16px}
nav.tabs .in{grid-template-columns:1fr auto 1fr;align-items:center;max-width:340px}
.fab{width:62px;height:62px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(140deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;margin:-28px 6px 0;padding:0;box-shadow:0 10px 24px rgba(226,71,127,.4)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}
.sheet-bg{position:fixed;inset:0;background:rgba(40,10,25,.4);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:9;max-height:86%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px;min-height:42px;color:var(--muted);font-weight:700}
.sheet .row input[type=text]{flex-basis:100%}
.sheet .row input[type=number]{flex:0 0 90px}
.sheet .row .btn{flex:1}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sh .22s ease-out}@keyframes sh{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 28"><g class="b"><ellipse cx="12" cy="8" rx="5.2" ry="6.6"/><rect x="10.6" y="14" width="2.8" height="12.5" rx="1.4"/></g></symbol>
</svg>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="in">
  <a href="#heute" data-v="heute"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</a>

<script>
/* ---------- Daten ---------- */
const DEFAULT_ACTS=[
  {id:'a1',name:'Duschen',cost:2},{id:'a2',name:'Anziehen',cost:1},{id:'a3',name:'Essen zubereiten',cost:2},
  {id:'a4',name:'Kochen (richtig)',cost:3},{id:'a5',name:'Einkaufen',cost:4},{id:'a6',name:'Telefonat',cost:1},
  {id:'a7',name:'Arzttermin',cost:4},{id:'a8',name:'Bildschirm (1 Std.)',cost:2},{id:'a9',name:'Besuch / Treffen',cost:3},
  {id:'a10',name:'Haushalt (kurz)',cost:2},{id:'a11',name:'Kurzer Spaziergang',cost:2},{id:'a12',name:'Lesen',cost:1}
];
let S={settings:{base:12,reserve:2,acts:DEFAULT_ACTS.map(a=>({...a}))},days:{}};
const LS='loeffel-budget-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.settings&&o.days)S=o}}catch(e){}}
loadLocal();

/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const toDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=toDate(k);d.setDate(d.getDate()+n);return keyOf(d)};
const longDate=k=>toDate(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const shortDate=k=>toDate(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'});
const used=d=>d&&d.log?d.log.reduce((a,x)=>a+x.cost,0):0;
const planned=d=>d&&d.plan?d.plan.reduce((a,x)=>a+x.cost,0):0;
function rawBudget(k){const d=S.days[k];return d&&typeof d.budget==='number'?d.budget:S.settings.base}
function debtOf(k){const d=S.days[k];if(!d)return 0;return Math.max(0,used(d)-rawBudget(k))}
function budgetOf(k){const d=S.days[k];if(d&&typeof d.budget==='number')return d.budget;return Math.max(1,S.settings.base-debtOf(addDays(k,-1)))}
function ensureDay(k){if(!S.days[k])S.days[k]={log:[],plan:[]};const d=S.days[k];d.log=d.log||[];d.plan=d.plan||[];return d}
function hasContent(d){return d&&((d.log&&d.log.length)||(d.plan&&d.plan.length)||d.checkin||d.crash||d.note)}

/* ---------- Ansicht ---------- */
const VIEWS=['heute','verlauf','einstellungen'];
let view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'heute';
let cur=todayKey();
let ci={sleep:null,sym:null,adj:0};
let sheet=null; // null oder 'log' | 'plan'
let lastUndo=null, toastTimer=null, needRender=false;

/* ---------- Speichern: Konto (db) mit lokalem Cache ---------- */
let col=null, syncState='local';
const timers={}, writing={}, again={}, dirty=new Set();
function setSync(s){syncState=s;const el=$('#sync');if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const m={local:['','Nur auf diesem Gerät'],loading:['','Lädt …'],ok:['ok','In deinem Konto gespeichert'],saving:['','Speichert …'],offline:['warn','Gerade nicht erreichbar – wird nachgeholt'],err:['warn','Speichern fehlgeschlagen']}[syncState];
  return `<span class="sync ${m[0]}" id="sync" role="status"><i></i>${m[1]}</span>`;
}
function persist(id){
  saveLocal();
  if(!col)return;
  dirty.add(id);
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>flush(id),700);
}
function bodyOf(id){return id==='settings'?S.settings:S.days[id.slice(2)]}
async function writeDoc(id){
  const body=bodyOf(id);
  if(body&&(id==='settings'||hasContent(body)))await col.doc(id).set(JSON.parse(JSON.stringify(body)));
  else await col.doc(id).delete();
}
async function flush(id){
  if(writing[id]){again[id]=true;return}
  writing[id]=true;dirty.delete(id);setSync('saving');
  try{await writeDoc(id);setSync('ok')}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await writeDoc(id);setSync('ok')}catch(e2){setSync('err')}}
    else setSync('err');
  }
  writing[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}
async function writeAll(){
  if(!col)return;
  setSync('saving');
  try{
    await col.doc('settings').set(JSON.parse(JSON.stringify(S.settings)));
    for(const k of Object.keys(S.days)){if(hasContent(S.days[k]))await col.doc('d-'+k).set(JSON.parse(JSON.stringify(S.days[k])))}
    setSync('ok');
  }catch(e){setSync('err')}
}
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let db,user;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  let id=null;try{id=await user.id()}catch(e){}
  if(!id)return;
  try{col=db.collection('data/users/'+id)}catch(e){return}
  setSync('loading');
  let first=true;
  const timer=setTimeout(()=>{if(syncState==='loading')setSync('offline')},10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer)}
    if(first&&!snap.metadata.fromCache){
      first=false;
      if(snap.empty){
        if(Object.keys(S.days).some(k=>hasContent(S.days[k])))writeAll();else setSync('ok');
        return;
      }
    }
    if(snap.empty&&snap.metadata.fromCache)return;
    const days={};let settings=null;
    snap.docs.forEach(doc=>{
      if(!doc.exists)return;
      const v=JSON.parse(JSON.stringify(doc.data()));
      if(doc.id==='settings')settings=v;
      else if(doc.id.startsWith('d-'))days[doc.id.slice(2)]=v;
    });
    dirty.forEach(id=>{if(id==='settings')settings=S.settings;else{const k=id.slice(2);if(S.days[k])days[k]=S.days[k];else delete days[k]}});
    if(settings&&settings.acts)S.settings=settings;
    S.days=days;
    saveLocal();
    if(!snap.metadata.fromCache&&syncState!=='saving')setSync('ok');
    softRender();
  },err=>{clearTimeout(timer);if(err&&err.code==='revoked'){col=null;setSync('local')}else setSync('offline')});
}

  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>'
};
function spoonSVG(cls){return `<svg class="spoon ${cls}" aria-hidden="true"><use href="#sp"/></svg>`}
function spoonsHTML(budget,u,reserve){
  const rem=budget-u;let h='';
  for(let i=0;i<budget;i++)h+=spoonSVG(i<rem?(i<reserve?'res':''):'usedup');
  for(let i=0;i<-rem;i++)h+=spoonSVG('borrow');
  return `<div class="spoons" role="img" aria-label="${Math.max(rem,0)} von ${budget} Löffeln übrig">${h}</div>`;
}
function costLabel(c){return c<0?`+${-c}`:`${c}`}
function gearBtn(){return `<a class="iconbtn gear" href="#einstellungen" aria-label="Anpassen">${ICON.gear}</a>`}
function dayNav(){
  const t=todayKey();
  const tag=cur===t?'Heute':cur===addDays(t,1)?'Morgen':cur===addDays(t,-1)?'Gestern':'';
  return `<div class="top"><div class="daynav">
    <button class="iconbtn" data-a="day" data-d="-1" aria-label="Vorheriger Tag">‹</button>
    <div class="lbl">${esc(longDate(cur))}${tag?`<small>${tag}</small>`:`<small><button class="btn ghost" style="min-height:26px;padding:2px 10px;font-size:12px" data-a="day" data-d="0">Zu heute</button></small>`}</div>
    <button class="iconbtn" data-a="day" data-d="1" aria-label="Nächster Tag" ${cur>=addDays(t,7)?'disabled':''}>›</button>

}
function suggestion(){
  const b=S.settings.base;
  const sl=[0,Math.round(b*.1),Math.round(b*.25)][ci.sleep??0];
  const sy=[0,Math.round(b*.15),Math.round(b*.35)][ci.sym??0];
  return Math.max(1,b-debtOf(addDays(cur,-1))-sl-sy+ci.adj);
}
function checkinHTML(){
  const debt=debtOf(addDays(cur,-1));
  const pills=(k,opts)=>`<div class="pills" role="group">${opts.map((o,i)=>`<button class="pill" data-a="ci" data-k="${k}" data-v="${i}" aria-pressed="${ci[k]===i}">${o}</button>`).join('')}</div>`;

/* ---------- Seiten ---------- */
function renderHeute(){
  const d=S.days[cur];const budget=budgetOf(cur);const u=used(d);const rem=budget-u;const res=S.settings.reserve;
  const plan=(d&&d.plan)||[];const p=planned(d);const log=(d&&d.log)||[];
  let st;
  if(rem<0)st=['over',`Du hast ${-rem} Löffel von morgen geliehen. Wenn es geht: hinlegen, Reize runter.`];
  else if(rem===0)st=['over','Dein Budget für heute ist aufgebraucht. Alles Weitere geht auf morgen.'];
  else if(rem<=res)st=['warn','Du bist in deinem Puffer. Zeit für eine echte Pause.'];
  else st=['ok','Du bist in deinem Rahmen.'];
  let pl='';
  if(plan.length){const after=rem-p;pl=after<0?`Geplant: ${p} · ${-after} mehr als übrig`:`Geplant: ${p} · danach bleiben ${after}${after<=res?' (Puffer)':''}`}
  const showCI=!(d&&d.checkin)&&cur<=todayKey();
  const time=t=>t?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
  return `${dayNav()}
  ${showCI?checkinHTML():''}
  <section class="card hero" aria-label="Löffel">
    <div class="big"><b>${Math.max(rem,0)}</b><span>von ${budget} Löffeln übrig</span>
      <span class="stepper" style="margin-left:auto"><button data-a="bud" data-d="-1" aria-label="Budget verringern">−</button><button data-a="bud" data-d="1" aria-label="Budget erhöhen">+</button></span></div>
    ${spoonsHTML(budget,u,res)}
    ${pl?`<div class="planline">${pl}</div>`:''}
    <div class="status ${st[0]}">${st[1]}</div>
  </section>
  ${plan.length?`<section class="card" aria-labelledby="pl-h">
    <div class="sec"><h2 id="pl-h">Geplant</h2><span class="small muted">Antippen = erledigt</span></div>
    <div class="list">${plan.map(x=>`<div class="item planned"><button class="check" data-a="plan-done" data-id="${x.id}" aria-label="${esc(x.name)} als erledigt eintragen">✓</button><span class="n">${esc(x.name)}</span><span class="c">${costLabel(x.cost)}</span><button class="x" data-a="plan-del" data-id="${x.id}" aria-label="${esc(x.name)} aus dem Plan nehmen">×</button></div>`).join('')}</div>
  </section>`:''}
  <section class="card" aria-labelledby="done-h">
    <div class="sec"><h2 id="done-h">Gemacht</h2><span class="small muted">${u} Löffel</span></div>
    ${log.length?`<div class="list">${log.slice().reverse().map(x=>`<div class="item"><span class="t">${time(x.t)}</span><span class="n">${esc(x.name)}</span><span class="c">${costLabel(x.cost)}</span><button class="x" data-a="log-del" data-id="${x.id}" aria-label="${esc(x.name)} entfernen">×</button></div>`).join('')}</div>`
      :`<div class="empty"><b>Noch nichts eingetragen</b>Tippe unten auf +, um einzutragen oder zu planen.</div>`}
  </section>
  <details class="fold" ${d&&(d.note||d.crash)?'open':''}>
    <summary><span>Notiz &amp; Befinden ${d&&d.crash?'<span class="badge">Crash</span>':''}</span><span class="chev">›</span></summary>
    <div class="inner">
      <label class="toggle"><input type="checkbox" id="crash" data-f="crash" ${d&&d.crash?'checked':''}> Crash / PEM heute</label>
      <label class="small muted" for="note">Symptome, Auslöser, was gutgetan hat</label>
      <textarea id="note" data-f="note" placeholder="Kurz reicht.">${esc((d&&d.note)||'')}</textarea>
      ${hasContent(d)?'<button class="btn ghost" data-a="day-reset">Diesen Tag leeren</button>':''}
    </div>
  </details>`;
}
function renderVerlauf(){
  const t=todayKey();const N=14;const keys=[];for(let i=N-1;i>=0;i--)keys.push(addDays(t,-i));
  const vals=keys.map(k=>({k,u:used(S.days[k]),b:budgetOf(k),has:hasContent(S.days[k]),crash:!!(S.days[k]&&S.days[k].crash)}));
  const max=Math.max(S.settings.base,...vals.map(v=>Math.max(v.u,v.b)))+1;
  const W=350,H=170,top=10,bot=34,left=4,cw=(W-left*2)/N,ch=H-top-bot,y=v=>top+ch-(v/max)*ch;
  let bars='',grid='';
  [0,Math.round(max/2),max-1].forEach(g=>{grid+=`<line x1="${left}" x2="${W-left}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>`});
  vals.forEach((v,i)=>{
    const x=left+i*cw,bw=cw*.58,bx=x+(cw-bw)/2;
    const col=v.u>v.b?'var(--over)':v.u>v.b-S.settings.reserve?'var(--warn)':'var(--accent)';
    if(v.has&&v.u>0)bars+=`<rect x="${bx}" y="${y(v.u)}" width="${bw}" height="${Math.max(1,(v.u/max)*ch)}" rx="3" fill="${col}"><title>${shortDate(v.k)}: ${v.u} von ${v.b}</title></rect>`;
    bars+=`<line x1="${x+cw*.12}" x2="${x+cw*.88}" y1="${y(v.b)}" y2="${y(v.b)}" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>`;
    bars+=`<text x="${x+cw/2}" y="${H-bot+12}" text-anchor="middle" ${v.k===t?'style="fill:var(--ink);font-weight:700"':''}>${toDate(v.k).getDate()}</text>`;
    if(v.crash)bars+=`<circle cx="${x+cw/2}" cy="${H-bot+24}" r="3.6" fill="var(--over)"><title>Crash</title></circle>`;
  });
  const withData=vals.filter(v=>v.has);
  const avg=withData.length?Math.round(withData.reduce((a,v)=>a+v.u,0)/withData.length*10)/10:0;
  const overDays=withData.filter(v=>v.u>v.b).length;
  const crashes=vals.filter(v=>v.crash).length;
  const allKeys=Object.keys(S.days).filter(k=>S.days[k].crash);
  const after=allKeys.filter(k=>[1,2].some(n=>{const p=addDays(k,-n);return S.days[p]&&used(S.days[p])>rawBudget(p)})).length;
  const list=Object.keys(S.days).filter(k=>hasContent(S.days[k])).sort().reverse().slice(0,30);
  return `<div class="top"><h1>Verlauf</h1>${gearBtn()}</div>
  <section class="card" aria-labelledby="v-h">
    <h2 id="v-h">Die letzten 14 Tage</h2>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Löffelverbrauch der letzten 14 Tage">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>im Rahmen</span><span><i style="background:var(--warn)"></i>im Puffer</span><span><i style="background:var(--over)"></i>überzogen</span><span><i style="height:2px;background:var(--ink);opacity:.55"></i>Budget</span><span><i style="border-radius:50%;background:var(--over)"></i>Crash</span></div>
    <div class="stats">
      <div class="stat"><b>${avg}</b><span>Ø Löffel pro Tag</span></div>
      <div class="stat"><b>${overDays}</b><span>Tage überzogen</span></div>
      <div class="stat"><b>${crashes}</b><span>Crash-Tage</span></div>
    </div>
    ${allKeys.length?`<div class="hint">${after} von ${allKeys.length} ${allKeys.length===1?'Crash folgte':'Crashs folgten'} innerhalb von 1–2 Tagen auf einen überzogenen Tag. PEM kommt oft verzögert.</div>`:''}
  </section>
  <section class="card" aria-labelledby="t-h">
    <h2 id="t-h">Tage</h2>
    ${list.length?`<div class="list">${list.map(k=>{const d=S.days[k],u=used(d),b=budgetOf(k),tot=Math.max(b,u,1);
      return `<button class="hist" data-a="goto" data-k="${k}"><span class="d">${esc(shortDate(k))}</span><span class="bar"><span class="meter" style="display:flex"><i style="width:${Math.min(u,b)/tot*100}%;background:${u>b?'var(--over)':'var(--accent)'}"></i><i style="width:${Math.max(0,u-b)/tot*100}%;background:var(--over)"></i></span>${d.note?`<span class="small muted" style="display:block;margin-top:4px;overflow-wrap:anywhere">${esc(d.note.length>80?d.note.slice(0,80)+' …':d.note)}</span>`:''}</span><span class="c small" style="font-variant-numeric:tabular-nums">${u}/${b}</span>${d.crash?'<span class="badge">Crash</span>':''}</button>`}).join('')}</div>`:'<div class="empty"><b>Noch keine Tage</b>Sobald du etwas einträgst, erscheint es hier.</div>'}
  </section>`;
}

  <section class="card" aria-labelledby="st-h">

/* ---------- Blatt (+) ---------- */
function renderSheet(){
  const el=$('#sheet');
  if(!sheet){el.innerHTML='';return}
  const d=S.days[cur];const rem=budgetOf(cur)-used(d)-planned(d);
  const isLog=sheet==='log';
  el.innerHTML=`<div class="sheet-bg" data-a="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Aktivität hinzufügen">
    <div class="grab"></div>
    <div class="sec"><h2>${cur===todayKey()?'Heute':esc(shortDate(cur))}</h2><span class="small muted">${Math.max(rem,0)} Löffel frei</span></div>
    <div class="seg" role="group" aria-label="Art">
      <button data-a="sheet-mode" data-m="log" aria-pressed="${isLog}">Gemacht</button>
      <button data-a="sheet-mode" data-m="plan" aria-pressed="${!isLog}">Geplant</button>
    </div>
    <div class="chips">${S.settings.acts.map(a=>`<button class="chip" data-a="pick" data-id="${a.id}"><span>${esc(a.name)}</span><span class="c ${a.cost<0?'neg':''}">${costLabel(a.cost)}</span></button>`).join('')}</div>
    <div class="row">
      <input type="text" id="cname" placeholder="Etwas anderes …" autocomplete="off" aria-label="Eigene Aktivität">
      <input type="number" id="ccost" value="2" min="-5" max="30" aria-label="Löffel">
      <button class="btn" data-a="pick-custom">${isLog?'Eintragen':'Planen'}</button>

function openSheet(){sheet=cur>todayKey()?'plan':'log';renderSheet()}
function closeSheet(){sheet=null;renderSheet()}

/* ---------- Rendering ---------- */
function render(){
  needRender=false;
  const body=view==='heute'?renderHeute():view==='verlauf'?renderVerlauf():renderEinst();
  $('#app').innerHTML=body;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===view?'page':'false'));
  if(sheet)renderSheet();
}
function softRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))){needRender=true;return}
  render();
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(needRender)softRender()},0)});

/* ---------- Toast & Dialog ---------- */
function toast(msg,undo){
  lastUndo=undo||null;clearTimeout(toastTimer);
  $('#toast').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-a="undo">Rückgängig</button>':''}</div>`;
  toastTimer=setTimeout(()=>{$('#toast').innerHTML='';lastUndo=null},4500);
}
function ask(msg,ok,fn){
  $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="m-no">Abbrechen</button><button class="btn" data-a="m-ok">${esc(ok)}</button></div></div></div>`;
  ask.fn=fn;$('#modal [data-a="m-ok"]').focus();
}

/* ---------- Aktionen ---------- */
function findAct(id){return S.settings.acts.find(a=>a.id===id)}
function readCustom(){
  const n=($('#cname')||{}).value?.trim();let c=parseInt(($('#ccost')||{}).value,10);
  if(!n){toast('Bitte gib einen Namen ein.');$('#cname')&&$('#cname').focus();return null}
  if(isNaN(c))c=1;c=Math.max(-5,Math.min(30,c));
  return {name:n,cost:c};
}
function addItem(name,cost){
  const d=ensureDay(cur);const id=uid();
  if(sheet==='plan'){d.plan.push({id,name,cost});persist('d-'+cur);closeSheet();if(view!=='heute')location.hash='heute';render();toast(`${name} geplant`,{k:cur,id,type:'plan'})}
  else{d.log.push({id,name,cost,t:Date.now()});persist('d-'+cur);closeSheet();if(view!=='heute')location.hash='heute';render();toast(`${name}: ${cost<0?'+'+(-cost):'−'+cost} Löffel`,{k:cur,id,type:'log'})}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,dk='d-'+cur;
  switch(a){
    case 'sheet':openSheet();break;
    case 'sheet-close':closeSheet();break;
    case 'sheet-mode':sheet=b.dataset.m;renderSheet();break;
    case 'pick':{const x=findAct(b.dataset.id);if(x)addItem(x.name,x.cost);break}
    case 'pick-custom':{const c=readCustom();if(c)addItem(c.name,c.cost);break}
    case 'day':{const n=+b.dataset.d;cur=n===0?todayKey():addDays(cur,n);ci={sleep:null,sym:null,adj:0};render();break}
    case 'log-del':{const d=ensureDay(cur);d.log=d.log.filter(x=>x.id!==b.dataset.id);persist(dk);render();break}
    case 'undo':{if(lastUndo){const d=S.days[lastUndo.k];if(d){const f=lastUndo.type==='plan'?'plan':'log';d[f]=d[f].filter(x=>x.id!==lastUndo.id);persist('d-'+lastUndo.k)}lastUndo=null;$('#toast').innerHTML='';render()}break}
    case 'plan-del':{const d=ensureDay(cur);d.plan=d.plan.filter(x=>x.id!==b.dataset.id);persist(dk);render();break}
    case 'plan-done':{const d=ensureDay(cur);const p=d.plan.find(x=>x.id===b.dataset.id);if(p){d.plan=d.plan.filter(x=>x!==p);d.log.push({id:uid(),name:p.name,cost:p.cost,t:Date.now()});persist(dk);render();toast(`${p.name} erledigt`)}break}
    case 'ci':{const k=b.dataset.k,v=+b.dataset.v;ci[k]=ci[k]===v?null:v;render();break}
    case 'ci-adj':{if(suggestion()+(+b.dataset.d)>=1)ci.adj+=+b.dataset.d;render();break}
    case 'ci-start':{const d=ensureDay(cur);d.budget=suggestion();d.checkin={sleep:ci.sleep,sym:ci.sym};ci={sleep:null,sym:null,adj:0};persist(dk);render();break}
    case 'ci-skip':{const d=ensureDay(cur);d.budget=budgetOf(cur);d.checkin={skipped:true};persist(dk);render();break}
    case 'bud':{const d=ensureDay(cur);d.budget=Math.max(1,budgetOf(cur)+(+b.dataset.d));if(!d.checkin)d.checkin={skipped:true};persist(dk);render();break}
    case 'day-reset':ask('Alle Einträge, den Plan und die Notiz für diesen Tag löschen?','Leeren',()=>{delete S.days[cur];persist(dk);render()});break;
    case 'goto':{cur=b.dataset.k;location.hash='heute';break}
    case 'base':{S.settings.base=Math.max(1,Math.min(60,S.settings.base+(+b.dataset.d)));persist('settings');render();break}
    case 'res':{S.settings.reserve=Math.max(0,Math.min(S.settings.base-1,S.settings.reserve+(+b.dataset.d)));persist('settings');render();break}
    case 'act-add':{const id='a'+uid();S.settings.acts.push({id,name:'Neue Aktivität',cost:1});persist('settings');render();const el=document.getElementById('an-'+id);if(el){el.focus();el.select()}break}
    case 'act-del':{S.settings.acts=S.settings.acts.filter(x=>x.id!==b.dataset.id);persist('settings');render();break}
    case 'export':{
      const txt=JSON.stringify(S);
      const manual=()=>{$('#imp').value=txt;$('#imp').select();toast('Markiert – jetzt selbst kopieren.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Sicherung kopiert. Füge sie z. B. in eine Notiz ein.'),manual)}catch(err){manual()}
      break}
    case 'import':{
      let o;try{o=JSON.parse($('#imp').value)}catch(err){toast('Das sieht nicht wie eine Sicherung aus.');break}
      if(!o||!o.settings||!o.days||!Array.isArray(o.settings.acts)){toast('Das sieht nicht wie eine Sicherung aus.');break}
      ask('Die aktuellen Daten werden durch die Sicherung ersetzt.','Ersetzen',async()=>{
        const old=Object.keys(S.days);S=o;saveLocal();render();
        if(col){for(const k of old)if(!S.days[k]){try{await col.doc('d-'+k).delete()}catch(e){}}await writeAll()}
        toast('Sicherung wiederhergestellt.');
      });break}
    case 'm-ok':{const f=ask.fn;$('#modal').innerHTML='';if(f)f();break}
    case 'm-no':{$('#modal').innerHTML='';break}
  }
});
document.addEventListener('change',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='crash'){ensureDay(cur).crash=e.target.checked;persist('d-'+cur);render()}
  if(f==='act-name'){const x=findAct(e.target.dataset.id);if(x){x.name=e.target.value.trim()||x.name;persist('settings')}}
  if(f==='act-cost'){const x=findAct(e.target.dataset.id);if(x){let c=parseInt(e.target.value,10);if(isNaN(c))c=x.cost;x.cost=Math.max(-5,Math.min(30,c));persist('settings')}}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.f==='note'){ensureDay(cur).note=e.target.value;persist('d-'+cur)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cname'){const btn=document.querySelector('[data-a="pick-custom"]');if(btn)btn.click()}
  if(e.key==='Escape'){if($('#modal').innerHTML)$('#modal').innerHTML='';else if(sheet)closeSheet()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)){view=h;render();window.scrollTo(0,0)}});

render();
initCloud();
</script>
</body>
