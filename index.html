<style>
/* Layout: eine ruhige Spalte (max. 560px), Tab-Leiste unten, große Tippflächen – wenig Reize für Tage mit Brain Fog */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#1f2730; --muted:#5f6b78; --line:#d9e0e7;
  --accent:#3d6b8f; --accent-soft:#e2ebf3;
  --ok:#4f8a68; --warn:#b7822f; --warn-soft:#f6ecd9; --over:#b0524a; --over-soft:#f6e2df;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161b21; --card:#1f262e; --ink:#e7ecf1; --muted:#9ba7b3; --line:#323c47;
    --accent:#7fa9cc; --accent-soft:#25384a;
    --ok:#7bb894; --warn:#dcaa5e; --warn-soft:#3a3020; --over:#e08579; --over-soft:#432a27;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161b21; --card:#1f262e; --ink:#e7ecf1; --muted:#9ba7b3; --line:#323c47;
  --accent:#7fa9cc; --accent-soft:#25384a;
  --ok:#7bb894; --warn:#dcaa5e; --warn-soft:#3a3020; --over:#e08579; --over-soft:#432a27;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 110px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.warn i{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{font-family:var(--f-display);font-weight:500;text-align:center;flex:1}
.daynav .lbl small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.hero{gap:14px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-weight:600;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:17px;line-height:1}
.status{border-radius:12px;padding:10px 12px;font-size:15px}
.status.ok{background:var(--accent-soft)} .status.warn{background:var(--warn-soft)} .status.over{background:var(--over-soft)}
.spoons{display:flex;flex-wrap:wrap;gap:4px}
.spoon{width:26px;height:30px}
.spoon .b{fill:var(--accent)}
.spoon.res .b{fill:var(--warn)}
.spoon.empty .b{fill:none;stroke:var(--line);stroke-width:1.6}
.spoon.borrow .b{fill:var(--over-soft);stroke:var(--over);stroke-width:1.4;stroke-dasharray:2 2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;display:inline-flex;gap:8px;align-items:center;min-height:44px;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip .c{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .c.neg{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:140px}
input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=number]{width:76px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:80px;resize:vertical}
.btn{border:none;background:var(--accent);color:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.wide{width:100%}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px}
.item .c{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:20px}
.x:hover{background:var(--bg);color:var(--over)}
.check{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ok);font-weight:700}
.check:hover{border-color:var(--ok)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-weight:700;font-size:15px}
.suggest{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px}
.suggest b{font-family:var(--f-display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--over)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9px}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.hist:first-child{border-top:none}
.hist .d{width:92px;font-size:14px}
.hist .bar{flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--over-soft);color:var(--over);font-weight:700;white-space:nowrap}
.actrow{display:flex;gap:8px;align-items:center}
.actrow input[type=text]{flex:1;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{color:var(--muted);text-decoration:none;text-align:center;padding:10px 4px 12px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);z-index:5}
.toast button{background:none;border:none;color:var(--accent-soft);font-weight:700;text-decoration:underline;min-height:36px}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.hint{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 28"><g class="b"><ellipse cx="12" cy="8" rx="5.2" ry="6.6"/><rect x="10.6" y="14" width="2.8" height="12.5" rx="1.4"/></g></symbol>
</svg>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="in">
  <a href="#heute" data-v="heute"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</a>
  <a href="#planen" data-v="planen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h5"/></svg>Planen</a>
  <a href="#verlauf" data-v="verlauf"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Verlauf</a>
  <a href="#einstellungen" data-v="einstellungen"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Anpassen</a>
</div></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
/* ---------- Daten ---------- */
const DEFAULT_ACTS=[
  {id:'a1',name:'Duschen',cost:2},{id:'a2',name:'Anziehen',cost:1},{id:'a3',name:'Essen zubereiten',cost:2},
  {id:'a4',name:'Kochen (richtig)',cost:3},{id:'a5',name:'Einkaufen',cost:4},{id:'a6',name:'Telefonat',cost:1},
  {id:'a7',name:'Arzttermin',cost:4},{id:'a8',name:'Bildschirm (1 Std.)',cost:2},{id:'a9',name:'Besuch / Treffen',cost:3},
  {id:'a10',name:'Haushalt (kurz)',cost:2},{id:'a11',name:'Kurzer Spaziergang',cost:2},{id:'a12',name:'Lesen',cost:1}
];
let S={settings:{base:12,reserve:2,acts:DEFAULT_ACTS.map(a=>({...a}))},days:{}};
const LS='loeffel-budget-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.settings&&o.days)S=o}}catch(e){}}
loadLocal();

/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const toDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=toDate(k);d.setDate(d.getDate()+n);return keyOf(d)};
const longDate=k=>toDate(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const shortDate=k=>toDate(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'});
const L=n=>n===1||n===-1?'Löffel':'Löffel';
const used=d=>d&&d.log?d.log.reduce((a,x)=>a+x.cost,0):0;
function rawBudget(k){const d=S.days[k];return d&&typeof d.budget==='number'?d.budget:S.settings.base}
function debtOf(k){const d=S.days[k];if(!d)return 0;return Math.max(0,used(d)-rawBudget(k))}
function budgetOf(k){const d=S.days[k];if(d&&typeof d.budget==='number')return d.budget;return Math.max(1,S.settings.base-debtOf(addDays(k,-1)))}
function ensureDay(k){if(!S.days[k])S.days[k]={log:[],plan:[]};const d=S.days[k];d.log=d.log||[];d.plan=d.plan||[];return d}
function hasContent(d){return d&&((d.log&&d.log.length)||(d.plan&&d.plan.length)||d.checkin||d.crash||d.note)}

/* ---------- Ansicht ---------- */
const VIEWS=['heute','planen','verlauf','einstellungen'];
let view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'heute';
let cur=todayKey();
let ci={sleep:null,sym:null,adj:0};
let lastUndo=null, toastTimer=null, needRender=false;

/* ---------- Speichern: Konto (db) mit lokalem Cache ---------- */
let col=null, syncState='local';
const timers={}, writing={}, again={}, dirty=new Set();
function setSync(s){syncState=s;const el=$('#sync');if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const m={local:['','Nur auf diesem Gerät'],loading:['','Lädt …'],ok:['ok','Gespeichert'],saving:['','Speichert …'],offline:['warn','Gerade nicht erreichbar – wird nachgeholt'],err:['warn','Speichern fehlgeschlagen']}[syncState];
  return `<span class="sync ${m[0]}" id="sync" role="status"><i></i>${m[1]}</span>`;
}
function persist(id){
  saveLocal();
  if(!col)return;
  dirty.add(id);
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>flush(id),700);
}
function bodyOf(id){return id==='settings'?S.settings:S.days[id.slice(2)]}
async function writeDoc(id){
  const body=bodyOf(id);
  if(body&&(id==='settings'||hasContent(body)))await col.doc(id).set(JSON.parse(JSON.stringify(body)));
  else await col.doc(id).delete();
}
async function flush(id){
  if(writing[id]){again[id]=true;return}
  writing[id]=true;dirty.delete(id);setSync('saving');
  try{await writeDoc(id);setSync('ok')}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await writeDoc(id);setSync('ok')}catch(e2){setSync('err')}}
    else setSync('err');
  }
  writing[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}
async function writeAll(){
  if(!col)return;
  setSync('saving');
  try{
    await col.doc('settings').set(JSON.parse(JSON.stringify(S.settings)));
    for(const k of Object.keys(S.days)){if(hasContent(S.days[k]))await col.doc('d-'+k).set(JSON.parse(JSON.stringify(S.days[k])))}
    setSync('ok');
  }catch(e){setSync('err')}
}
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let db,user;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  let id=null;try{id=await user.id()}catch(e){}
  if(!id)return;
  try{col=db.collection('data/users/'+id)}catch(e){return}
  setSync('loading');
  let first=true;
  const timer=setTimeout(()=>{if(syncState==='loading')setSync('offline')},10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer)}
    if(first&&!snap.metadata.fromCache){
      first=false;
      if(snap.empty){
        // Erstes Mal mit Konto: vorhandene Gerätedaten übernehmen
        if(Object.keys(S.days).some(k=>hasContent(S.days[k])))writeAll();else setSync('ok');
        return;
      }
    }
    const days={};let settings=null;
    snap.docs.forEach(doc=>{
      if(!doc.exists)return;
      const v=JSON.parse(JSON.stringify(doc.data()));
      if(doc.id==='settings')settings=v;
      else if(doc.id.startsWith('d-'))days[doc.id.slice(2)]=v;
    });
    if(snap.empty&&snap.metadata.fromCache)return;
    // Noch nicht gesendete eigene Änderungen behalten
    dirty.forEach(id=>{if(id==='settings')settings=S.settings;else{const k=id.slice(2);if(S.days[k])days[k]=S.days[k];else delete days[k]}});
    if(settings&&settings.acts)S.settings=settings;
    S.days=days;
    saveLocal();
    if(!snap.metadata.fromCache&&syncState!=='saving')setSync('ok');
    softRender();
  },err=>{clearTimeout(timer);setSync(err&&err.code==='revoked'?'local':'offline');col=err&&err.code==='revoked'?null:col});
}

/* ---------- Rendering ---------- */
function spoonSVG(cls){return `<svg class="spoon ${cls}" aria-hidden="true"><use href="#sp"/></svg>`}
function spoonsHTML(budget,u,reserve){
  const rem=budget-u;let h='';
  for(let i=0;i<budget;i++){
    if(i<rem)h+=spoonSVG(i<reserve?'res':'');else h+=spoonSVG('empty');
  }
  for(let i=0;i<-rem;i++)h+=spoonSVG('borrow');
  return `<div class="spoons" role="img" aria-label="${Math.max(rem,0)} von ${budget} Löffeln übrig">${h}</div>`;
}
function dayNav(){
  const t=todayKey();
  const tag=cur===t?'Heute':cur===addDays(t,1)?'Morgen':cur===addDays(t,-1)?'Gestern':'';
  return `<div class="daynav">
    <button class="iconbtn" data-a="day" data-d="-1" aria-label="Vorheriger Tag">‹</button>
    <div class="lbl">${esc(longDate(cur))}${tag?`<small>${tag}</small>`:`<small><button class="btn ghost" style="min-height:28px;padding:2px 10px;font-size:13px" data-a="day" data-d="0">Zu heute</button></small>`}</div>
    <button class="iconbtn" data-a="day" data-d="1" aria-label="Nächster Tag" ${cur>=addDays(t,7)?'disabled':''}>›</button>
  </div>`;
}
function costLabel(c){return c<0?`+${-c}`:`${c}`}
function chipsHTML(action){
  return `<div class="chips">${S.settings.acts.map(a=>`<button class="chip" data-a="${action}" data-id="${a.id}"><span>${esc(a.name)}</span><span class="c ${a.cost<0?'neg':''}">${costLabel(a.cost)}</span></button>`).join('')}</div>`;
}
function customHTML(action,label){
  return `<div class="row">
    <label class="small muted" for="cname" style="width:100%">Etwas anderes</label>
    <input type="text" id="cname" placeholder="z. B. Wäsche aufhängen" autocomplete="off">
    <input type="number" id="ccost" value="2" min="-5" max="30" aria-label="Löffel">
    <button class="btn" data-a="${action}">${label}</button>
  </div>`;
}
function suggestion(){
  const b=S.settings.base;
  const sl=[0,Math.round(b*.1),Math.round(b*.25)][ci.sleep??0];
  const sy=[0,Math.round(b*.15),Math.round(b*.35)][ci.sym??0];
  return Math.max(1,b-debtOf(addDays(cur,-1))-sl-sy+ci.adj);
}
function checkinHTML(){
  const debt=debtOf(addDays(cur,-1));
  const pills=(k,opts)=>`<div class="pills" role="group">${opts.map((o,i)=>`<button class="pill" data-a="ci" data-k="${k}" data-v="${i}" aria-pressed="${ci[k]===i}">${o}</button>`).join('')}</div>`;
  return `<section class="card" aria-labelledby="ci-h">
    <h2 id="ci-h">Wie startest du in den Tag?</h2>
    <div class="q"><label>Schlaf</label>${pills('sleep',['Erholsam','Geht so','Schlecht'])}</div>
    <div class="q"><label>Symptome gerade</label>${pills('sym',['Leicht','Mittel','Stark'])}</div>
    ${debt?`<div class="hint">Gestern hast du ${debt} ${L(debt)} geliehen. Die sind schon abgezogen.</div>`:''}
    <div class="suggest">
      <div><div class="small muted">Vorschlag für heute</div><b>${suggestion()}</b> <span class="muted">Löffel</span></div>
      <div class="stepper"><button data-a="ci-adj" data-d="-1" aria-label="Einen weniger">−</button><button data-a="ci-adj" data-d="1" aria-label="Einen mehr">+</button></div>
    </div>
    <div class="row"><button class="btn" style="flex:1" data-a="ci-start">Mit ${suggestion()} Löffeln starten</button><button class="btn ghost" data-a="ci-skip">Überspringen</button></div>
    <div class="small muted">Nur ein Vorschlag. Du kennst deinen Körper am besten.</div>
  </section>`;
}
function renderHeute(){
  const d=S.days[cur];const budget=budgetOf(cur);const u=used(d);const rem=budget-u;const res=S.settings.reserve;
  let st;
  if(rem<0)st=['over',`Du hast ${-rem} ${L(-rem)} von morgen geliehen. Morgen startest du mit weniger. Wenn es geht: hinlegen, Reize runter.`];
  else if(rem===0)st=['over','Dein Budget für heute ist aufgebraucht. Alles Weitere geht auf morgen.'];
  else if(rem<=res)st=['warn','Du bist in deinem Puffer. Ein guter Moment für eine echte Pause.'];
  else st=['ok',u===0?'Noch nichts eingetragen. Tippe unten an, was du gemacht hast.':'Du bist in deinem Rahmen.'];
  const showCI=!(d&&d.checkin)&&cur<=todayKey();
  const log=(d&&d.log)||[];
  return `${dayNav()}
  ${showCI?checkinHTML():''}
  <section class="card hero" aria-label="Löffel heute">
    <div class="big"><b>${Math.max(rem,0)}</b><span>von ${budget} Löffeln übrig</span>
      <span class="stepper" style="margin-left:auto"><button data-a="bud" data-d="-1" aria-label="Budget verringern">−</button><button data-a="bud" data-d="1" aria-label="Budget erhöhen">+</button></span></div>
    ${spoonsHTML(budget,u,res)}
    <div class="legend"><span><i style="background:var(--accent)"></i>verfügbar</span><span><i style="background:var(--warn)"></i>Puffer</span><span><i style="border:1.5px solid var(--line)"></i>verbraucht</span>${rem<0?'<span><i style="border:1.5px dashed var(--over)"></i>geliehen</span>':''}</div>
    <div class="status ${st[0]}">${st[1]}</div>
  </section>
  <section class="card" aria-labelledby="log-h">
    <h2 id="log-h">Was hast du gemacht?</h2>
    ${chipsHTML('log')}
    ${customHTML('log-custom','Eintragen')}
  </section>
  <section class="card" aria-labelledby="done-h">
    <h2 id="done-h">Eingetragen <span class="muted small">· ${u} ${L(u)}</span></h2>
    ${log.length?`<div class="list">${log.slice().reverse().map(x=>`<div class="item"><span class="t">${x.t?new Date(x.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</span><span class="n">${esc(x.name)}</span><span class="c">${costLabel(x.cost)}</span><button class="x" data-a="log-del" data-id="${x.id}" aria-label="${esc(x.name)} entfernen">×</button></div>`).join('')}</div>`:'<div class="muted small">Noch nichts.</div>'}
  </section>
  <section class="card" aria-labelledby="end-h">
    <h2 id="end-h">Wie geht es dir?</h2>
    <label class="toggle"><input type="checkbox" id="crash" data-f="crash" ${d&&d.crash?'checked':''}> Crash / PEM heute</label>
    <label class="small muted" for="note">Notiz (Symptome, Auslöser, was gutgetan hat)</label>
    <textarea id="note" data-f="note" placeholder="Kurz reicht.">${esc((d&&d.note)||'')}</textarea>
    ${hasContent(d)?'<button class="btn ghost" data-a="day-reset">Diesen Tag leeren</button>':''}
  </section>`;
}
function renderPlanen(){
  const d=S.days[cur];const budget=budgetOf(cur);const u=used(d);const plan=(d&&d.plan)||[];
  const p=plan.reduce((a,x)=>a+x.cost,0);const res=S.settings.reserve;
  const free=budget-u-res;
  const tot=Math.max(budget,u+p,1);
  const w=x=>Math.max(0,x)/tot*100;
  let msg;
  if(u+p>budget)msg=['over',`Der Plan liegt ${u+p-budget} ${L(u+p-budget)} über deinem Budget. Was kann warten oder kleiner werden?`];
  else if(p>free)msg=['warn',`Der Plan reicht in deinen Puffer hinein. Plane Pausen dazwischen ein.`];
  else msg=['ok',plan.length?`Passt. Danach bleiben dir ${budget-u-p} ${L(budget-u-p)}.`:'Wähle aus, was du vorhast. Die App rechnet mit.'];
  return `${dayNav()}
  <section class="card" aria-label="Planübersicht">
    <div class="big"><b>${p}</b><span>geplant · ${u} verbraucht · Budget ${budget}</span></div>
    <div class="meter" aria-hidden="true"><i style="width:${w(Math.min(u,budget))}%;background:var(--muted)"></i><i style="width:${w(Math.min(p,Math.max(0,budget-u)))}%;background:var(--accent)"></i><i style="width:${w(u+p-budget)}%;background:var(--over)"></i></div>
    <div class="legend"><span><i style="background:var(--muted)"></i>verbraucht</span><span><i style="background:var(--accent)"></i>geplant</span><span><i style="background:var(--over)"></i>darüber</span></div>
    <div class="status ${msg[0]}">${msg[1]}</div>
  </section>
  <section class="card" aria-labelledby="pl-h">
    <h2 id="pl-h">Geplant</h2>
    ${plan.length?`<div class="list">${plan.map(x=>`<div class="item"><button class="check" data-a="plan-done" data-id="${x.id}" aria-label="${esc(x.name)} als erledigt eintragen">✓</button><span class="n">${esc(x.name)}</span><span class="c">${costLabel(x.cost)}</span><button class="x" data-a="plan-del" data-id="${x.id}" aria-label="${esc(x.name)} aus dem Plan nehmen">×</button></div>`).join('')}</div><div class="small muted">Haken setzen trägt die Aktivität als erledigt ein.</div>`:'<div class="muted small">Noch nichts geplant.</div>'}
  </section>
  <section class="card" aria-labelledby="pa-h">
    <h2 id="pa-h">Hinzufügen</h2>
    ${chipsHTML('plan-add')}
    ${customHTML('plan-custom','Planen')}
  </section>`;
}
function renderVerlauf(){
  const t=todayKey();const N=14;const keys=[];for(let i=N-1;i>=0;i--)keys.push(addDays(t,-i));
  const vals=keys.map(k=>({k,u:used(S.days[k]),b:budgetOf(k),has:hasContent(S.days[k]),crash:!!(S.days[k]&&S.days[k].crash)}));
  const max=Math.max(S.settings.base,...vals.map(v=>Math.max(v.u,v.b)))+1;
  const W=350,H=170,top=10,bot=34,left=4,cw=(W-left*2)/N,ch=H-top-bot,y=v=>top+ch-(v/max)*ch;
  let bars='',grid='';
  [0,Math.round(max/2),max-1].forEach(g=>{grid+=`<line x1="${left}" x2="${W-left}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>`});
  vals.forEach((v,i)=>{
    const x=left+i*cw,bw=cw*.58,bx=x+(cw-bw)/2;
    const col=v.u>v.b?'var(--over)':v.u>v.b-S.settings.reserve?'var(--warn)':'var(--accent)';
    if(v.has&&v.u>0)bars+=`<rect x="${bx}" y="${y(v.u)}" width="${bw}" height="${Math.max(1,(v.u/max)*ch)}" rx="3" fill="${col}"><title>${shortDate(v.k)}: ${v.u} von ${v.b}</title></rect>`;
    bars+=`<line x1="${x+cw*.12}" x2="${x+cw*.88}" y1="${y(v.b)}" y2="${y(v.b)}" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>`;
    const dd=toDate(v.k);
    bars+=`<text x="${x+cw/2}" y="${H-bot+12}" text-anchor="middle" ${v.k===t?'style="fill:var(--ink);font-weight:700"':''}>${dd.getDate()}</text>`;
    if(v.crash)bars+=`<circle cx="${x+cw/2}" cy="${H-bot+24}" r="3.6" fill="var(--over)"><title>Crash</title></circle>`;
  });
  const withData=vals.filter(v=>v.has);
  const avg=withData.length?Math.round(withData.reduce((a,v)=>a+v.u,0)/withData.length*10)/10:0;
  const overDays=withData.filter(v=>v.u>v.b).length;
  const crashes=vals.filter(v=>v.crash).length;
  // Muster: Crash innerhalb von 1–2 Tagen nach Überziehen (alle Daten)
  const allKeys=Object.keys(S.days).filter(k=>S.days[k].crash);
  const after=allKeys.filter(k=>[1,2].some(n=>{const p=addDays(k,-n);return S.days[p]&&used(S.days[p])>rawBudget(p)})).length;
  const list=Object.keys(S.days).filter(k=>hasContent(S.days[k])).sort().reverse().slice(0,30);
  return `<section class="card" aria-labelledby="v-h">
    <h2 id="v-h">Die letzten 14 Tage</h2>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Löffelverbrauch der letzten 14 Tage">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>im Rahmen</span><span><i style="background:var(--warn)"></i>im Puffer</span><span><i style="background:var(--over)"></i>überzogen</span><span><i style="height:2px;background:var(--ink);opacity:.55"></i>Budget</span><span><i style="border-radius:50%;background:var(--over)"></i>Crash</span></div>
    <div class="stats">
      <div class="stat"><b>${avg}</b><span>Ø Löffel pro Tag</span></div>
      <div class="stat"><b>${overDays}</b><span>Tage überzogen</span></div>
      <div class="stat"><b>${crashes}</b><span>Crash-Tage</span></div>
    </div>
    ${allKeys.length?`<div class="hint">${after} von ${allKeys.length} ${allKeys.length===1?'Crash folgte':'Crashs folgten'} innerhalb von 1–2 Tagen auf einen überzogenen Tag. PEM kommt oft verzögert.</div>`:''}
  </section>
  <section class="card" aria-labelledby="t-h">
    <h2 id="t-h">Tage</h2>
    ${list.length?`<div class="list">${list.map(k=>{const d=S.days[k],u=used(d),b=budgetOf(k),tot=Math.max(b,u,1);
      return `<button class="hist" data-a="goto" data-k="${k}"><span class="d">${esc(shortDate(k))}</span><span class="bar"><span class="meter" style="display:flex"><i style="width:${Math.min(u,b)/tot*100}%;background:${u>b?'var(--over)':'var(--accent)'}"></i><i style="width:${Math.max(0,u-b)/tot*100}%;background:var(--over)"></i></span>${d.note?`<span class="small muted" style="display:block;margin-top:4px;overflow-wrap:anywhere">${esc(d.note.length>80?d.note.slice(0,80)+' …':d.note)}</span>`:''}</span><span class="c small" style="font-variant-numeric:tabular-nums">${u}/${b}</span>${d.crash?'<span class="badge">Crash</span>':''}</button>`}).join('')}</div>`:'<div class="muted small">Sobald du Tage einträgst, erscheinen sie hier.</div>'}
  </section>`;
}
function renderEinst(){
  const s=S.settings;
  return `<section class="card" aria-labelledby="b-h">
    <h2 id="b-h">Dein Grundbudget</h2>
    <div class="row" style="justify-content:space-between"><span>Löffel an einem durchschnittlichen Tag</span><span class="stepper"><button data-a="base" data-d="-1" aria-label="Weniger">−</button><b style="min-width:28px;text-align:center;font-family:var(--f-display)">${s.base}</b><button data-a="base" data-d="1" aria-label="Mehr">+</button></span></div>
    <div class="row" style="justify-content:space-between"><span>Puffer, den du nicht verplanst</span><span class="stepper"><button data-a="res" data-d="-1" aria-label="Weniger">−</button><b style="min-width:28px;text-align:center;font-family:var(--f-display)">${s.reserve}</b><button data-a="res" data-d="1" aria-label="Mehr">+</button></span></div>
    <div class="hint">Der Puffer hält dich unter deiner Belastungsgrenze. Bei ME/CFS hilft es, deutlich unter dem Maximum zu bleiben, damit kein Crash folgt.</div>
  </section>
  <section class="card" aria-labelledby="ak-h">
    <h2 id="ak-h">Deine Aktivitäten</h2>
    <div class="small muted">Name und Löffel-Kosten anpassen. Eine negative Zahl steht für etwas, das dir Energie zurückgibt.</div>
    <div class="list">${s.acts.map(a=>`<div class="item actrow"><input type="text" id="an-${a.id}" data-f="act-name" data-id="${a.id}" value="${esc(a.name)}" aria-label="Name"><input type="number" id="ac-${a.id}" data-f="act-cost" data-id="${a.id}" value="${a.cost}" min="-5" max="30" aria-label="Löffel"><button class="x" data-a="act-del" data-id="${a.id}" aria-label="${esc(a.name)} löschen">×</button></div>`).join('')}</div>
    <button class="btn ghost" data-a="act-add">Aktivität hinzufügen</button>
  </section>
  <section class="card" aria-labelledby="ds-h">
    <h2 id="ds-h">Daten</h2>
    <div class="small muted">${col?'Deine Einträge werden in deinem Konto gespeichert und sind nur für dich sichtbar.':'Deine Einträge liegen gerade nur in diesem Browser. Mach ab und zu eine Sicherung.'}</div>
    <div class="row"><button class="btn ghost" data-a="export">Sicherung kopieren</button></div>
    <label class="small muted" for="imp">Sicherung wiederherstellen</label>
    <textarea id="imp" placeholder="Kopierte Sicherung hier einfügen"></textarea>
    <button class="btn ghost" data-a="import">Wiederherstellen</button>
  </section>
  <section class="card" aria-labelledby="st-h">
    <h2 id="st-h">Über die Löffel-Theorie</h2>
    <div class="small">Christine Miserandino hat die Spoon Theory 2003 beschrieben: Wer chronisch krank ist, hat pro Tag nur eine begrenzte Zahl Löffel. Jede Tätigkeit kostet welche, auch Duschen oder ein Telefonat. Wer mehr ausgibt, leiht von morgen. Diese App ersetzt keine ärztliche Begleitung; sie hilft dir beim Pacing.</div>
  </section>`;
}
function render(){
  needRender=false;
  const title={heute:'Löffel-Budget',planen:'Planen',verlauf:'Verlauf',einstellungen:'Anpassen'}[view];
  let body=view==='heute'?renderHeute():view==='planen'?renderPlanen():view==='verlauf'?renderVerlauf():renderEinst();
  $('#app').innerHTML=`<header><h1>${title}</h1>${syncHTML()}</header>${body}`;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===view?'page':'false'));
}
function softRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))){needRender=true;return}
  render();
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(needRender)softRender()},0)});

/* ---------- Toast & Dialog ---------- */
function toast(msg,undo){
  lastUndo=undo||null;clearTimeout(toastTimer);
  $('#toast').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-a="undo">Rückgängig</button>':''}</div>`;
  toastTimer=setTimeout(()=>{$('#toast').innerHTML='';lastUndo=null},4500);
}
function ask(msg,ok,fn){
  $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="m-no">Abbrechen</button><button class="btn" data-a="m-ok">${esc(ok)}</button></div></div></div>`;
  ask.fn=fn;$('#modal [data-a="m-ok"]').focus();
}

/* ---------- Aktionen ---------- */
function findAct(id){return S.settings.acts.find(a=>a.id===id)}
function readCustom(){
  const n=($('#cname')||{}).value?.trim();let c=parseInt(($('#ccost')||{}).value,10);
  if(!n){toast('Bitte gib einen Namen ein.');$('#cname')&&$('#cname').focus();return null}
  if(isNaN(c))c=1;c=Math.max(-5,Math.min(30,c));
  return {name:n,cost:c};
}
function addLog(k,name,cost){
  const d=ensureDay(k);const e={id:uid(),name,cost,t:Date.now()};d.log.push(e);persist('d-'+k);render();
  toast(`${name}: ${cost<0?'+'+(-cost):'−'+cost} ${L(cost)}`,{k,id:e.id,type:'log'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,dk='d-'+cur;
  switch(a){
    case 'day':{const n=+b.dataset.d;cur=n===0?todayKey():addDays(cur,n);ci={sleep:null,sym:null,adj:0};render();break}
    case 'log':{const x=findAct(b.dataset.id);if(x)addLog(cur,x.name,x.cost);break}
    case 'log-custom':{const c=readCustom();if(c)addLog(cur,c.name,c.cost);break}
    case 'log-del':{const d=ensureDay(cur);d.log=d.log.filter(x=>x.id!==b.dataset.id);persist(dk);render();break}
    case 'undo':{if(lastUndo){const d=S.days[lastUndo.k];if(d){d.log=d.log.filter(x=>x.id!==lastUndo.id);persist('d-'+lastUndo.k)}lastUndo=null;$('#toast').innerHTML='';render()}break}
    case 'plan-add':{const x=findAct(b.dataset.id);if(x){ensureDay(cur).plan.push({id:uid(),name:x.name,cost:x.cost});persist(dk);render()}break}
    case 'plan-custom':{const c=readCustom();if(c){ensureDay(cur).plan.push({id:uid(),...c});persist(dk);render()}break}
    case 'plan-del':{const d=ensureDay(cur);d.plan=d.plan.filter(x=>x.id!==b.dataset.id);persist(dk);render();break}
    case 'plan-done':{const d=ensureDay(cur);const p=d.plan.find(x=>x.id===b.dataset.id);if(p){d.plan=d.plan.filter(x=>x!==p);d.log.push({id:uid(),name:p.name,cost:p.cost,t:Date.now()});persist(dk);render();toast(`${p.name} erledigt`)}break}
    case 'ci':{const k=b.dataset.k,v=+b.dataset.v;ci[k]=ci[k]===v?null:v;render();break}
    case 'ci-adj':{if(suggestion()+(+b.dataset.d)>=1)ci.adj+=+b.dataset.d;render();break}
    case 'ci-start':{const d=ensureDay(cur);d.budget=suggestion();d.checkin={sleep:ci.sleep,sym:ci.sym};ci={sleep:null,sym:null,adj:0};persist(dk);render();break}
    case 'ci-skip':{const d=ensureDay(cur);d.budget=budgetOf(cur);d.checkin={skipped:true};persist(dk);render();break}
    case 'bud':{const d=ensureDay(cur);d.budget=Math.max(1,budgetOf(cur)+(+b.dataset.d));if(!d.checkin)d.checkin={skipped:true};persist(dk);render();break}
    case 'day-reset':ask('Alle Einträge, den Plan und die Notiz für diesen Tag löschen?','Leeren',()=>{delete S.days[cur];persist(dk);render()});break;
    case 'goto':{cur=b.dataset.k;location.hash='heute';break}
    case 'base':{S.settings.base=Math.max(1,Math.min(60,S.settings.base+(+b.dataset.d)));persist('settings');render();break}
    case 'res':{S.settings.reserve=Math.max(0,Math.min(S.settings.base-1,S.settings.reserve+(+b.dataset.d)));persist('settings');render();break}
    case 'act-add':{const id='a'+uid();S.settings.acts.push({id,name:'Neue Aktivität',cost:1});persist('settings');render();const el=document.getElementById('an-'+id);if(el){el.focus();el.select()}break}
    case 'act-del':{S.settings.acts=S.settings.acts.filter(x=>x.id!==b.dataset.id);persist('settings');render();break}
    case 'export':{
      const txt=JSON.stringify(S);
      const done=()=>toast('Sicherung kopiert. Füge sie z. B. in eine Notiz ein.');
      try{navigator.clipboard.writeText(txt).then(done,()=>{$('#imp').value=txt;$('#imp').select();toast('Markiert – jetzt selbst kopieren.')})}catch(err){$('#imp').value=txt;$('#imp').select();toast('Markiert – jetzt selbst kopieren.')}
      break}
    case 'import':{
      let o;try{o=JSON.parse($('#imp').value)}catch(err){toast('Das sieht nicht wie eine Sicherung aus.');break}
      if(!o||!o.settings||!o.days||!Array.isArray(o.settings.acts)){toast('Das sieht nicht wie eine Sicherung aus.');break}
      ask('Die aktuellen Daten werden durch die Sicherung ersetzt.','Ersetzen',async()=>{
        const old=Object.keys(S.days);S=o;saveLocal();render();
        if(col){for(const k of old)if(!S.days[k]){try{await col.doc('d-'+k).delete()}catch(e){}}await writeAll()}
        toast('Sicherung wiederhergestellt.');
      });break}
    case 'm-ok':{const f=ask.fn;$('#modal').innerHTML='';if(f)f();break}
    case 'm-no':{$('#modal').innerHTML='';break}
  }
});
document.addEventListener('change',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='crash'){ensureDay(cur).crash=e.target.checked;persist('d-'+cur)}
  if(f==='act-name'){const x=findAct(e.target.dataset.id);if(x){x.name=e.target.value.trim()||x.name;persist('settings')}}
  if(f==='act-cost'){const x=findAct(e.target.dataset.id);if(x){let c=parseInt(e.target.value,10);if(isNaN(c))c=x.cost;x.cost=Math.max(-5,Math.min(30,c));persist('settings')}}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.f==='note'){ensureDay(cur).note=e.target.value;persist('d-'+cur)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cname'){const btn=document.querySelector('[data-a="log-custom"],[data-a="plan-custom"]');if(btn)btn.click()}
  if(e.key==='Escape'&&$('#modal').innerHTML){$('#modal').innerHTML=''}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)){view=h;render();window.scrollTo(0,0)}});

render();
initCloud();
</script>
</body>
</html>
